# Vitis HLS component configuration for the ZU3EG image filter.
#
# This is the unified Vitis flow -- there is no vitis_hls executable any more.
# Build it with the driver script one directory up:
#
#     ./build_hls.sh
#
# or step by step, from the CH11/HLS directory:
#
#     vitis-run --mode hls --csim    --config image_filter/hls_config.cfg --work_dir image_filter
#     v++ -c     --mode hls           --config image_filter/hls_config.cfg --work_dir image_filter
#     vitis-run --mode hls --cosim   --config image_filter/hls_config.cfg --work_dir image_filter
#     vitis-run --mode hls --package --config image_filter/hls_config.cfg --work_dir image_filter
#
# or open CH11/HLS as a workspace in the Vitis IDE (`vitis -w .`), which reads
# this file plus vitis-comp.json alongside it.
#
# NOTE: confirm the exact device string for your AUP-ZU3 board (silkscreen or
# board docs). ZU3EG appears in several packages -- sfvc784 and sbva484 are both
# common. The wrong package will still synthesise, but timing/pinout will be off.
part=xczu3eg-sfvc784-2-e

[hls]
flow_target=vivado
clock=5ns
clock_uncertainty=12.5%

syn.top=image_filter
syn.file=../src/image_filter.cpp
syn.cflags=-I../src

tb.file=../src/tb_image_filter.cpp
tb.cflags=-I../src

cosim.rtl=verilog
cosim.trace_level=none

# Package for the Vivado IP catalog. package.output.syn=false keeps the export
# fast -- it skips the optional post-synthesis timing/area characterisation.
package.output.format=ip_catalog
package.output.syn=false
package.ip.vendor=aup
package.ip.library=hls
package.ip.version=1.0
package.ip.display_name=RGBA Gray / Sobel Filter
